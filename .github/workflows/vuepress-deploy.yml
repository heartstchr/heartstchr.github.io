name: Deploy Stackseekers.com

on:
  push:
    branches:
      - vuepress

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Deps
        run: |
          pnpm install

      - name: Build Web
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          VITE_YOUTUBE_API_KEY: ${{secrets.VITE_YOUTUBE_API_KEY}}
          VITE_YOUTUBE_CHANNEL_ID: ${{secrets.VITE_YOUTUBE_CHANNEL_ID}}
          VITE_YOUTUBE_PODCAST_PLAYLIST_ID: ${{secrets.VITE_YOUTUBE_PODCAST_PLAYLIST_ID}}
          VITE_YOUTUBE_UPLOADS_PLAYLIST_ID: ${{secrets.VITE_YOUTUBE_UPLOADS_PLAYLIST_ID}}
          VITE_NOTION_ENDPOINT: ${{secrets.VITE_NOTION_ENDPOINT}}
          VITE_NOTION_DATABASE_ID: ${{secrets.VITE_NOTION_DATABASE_ID}}
          VITE_WHATSAPP_NUMBER: ${{secrets.VITE_WHATSAPP_NUMBER}}
          VITE_SUPPORT_EMAIL: ${{secrets.VITE_SUPPORT_EMAIL}}
        run: |-
          # Clear any existing cache
          rm -rf docs/.vuepress/.temp docs/.vuepress/.cache docs/.vuepress/dist
          # Build with clean state
          pnpm run build
          # Create .nojekyll file
          > docs/.vuepress/dist/.nojekyll
          # Copy CNAME for custom domain
          cp CNAME docs/.vuepress/dist/CNAME || true

      - name: Verify Build
        run: ls -la docs/.vuepress/dist

      - name: Deploy web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./docs/.vuepress/dist
          clean: true
